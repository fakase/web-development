<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang</title>
    
    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">

    <!-- CSS Utama Halaman Pertama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Efek Ambient Glow Background -->
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Konten Utama Tengah Layar -->
    <main class="welcome-container">
        <h1>SELAMAT DATANG</h1>
        <p class="welcome-subtitle">Keanggunan Klasik dalam Sentuhan Modern</p>
        
        <!-- Tombol Masuk ke Halaman Beranda -->
        <a href="beranda.html" class="welcome-btn">Masuk Ke Website</a>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Perusahaan Anda. Hak Cipta Dilindungi.</p>
    </footer>

    <!-- Script Transisi Memudar Halus -->
    <script>
        document.querySelector('.welcome-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            document.body.classList.add('fade-out-active');
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 600);
        });
    </script>

</body>
</html>
